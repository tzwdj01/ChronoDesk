name: ChronoDesk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug and release APK
        run: ./gradlew assembleDebug assembleRelease
      - name: Run lint
        run: ./gradlew lintDebug
